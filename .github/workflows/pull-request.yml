name: Pull Request Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Set up Maven Settings
        run: |
          mkdir -p $HOME/.m2
          cat > $HOME/.m2/settings.xml << EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
            xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
            xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                              https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <profiles>
              <profile>
                <id>default</id>
                <repositories>
                  <repository>
                    <id>central</id>
                    <url>https://repo1.maven.org/maven2</url>
                    <releases>
                      <enabled>true</enabled>
                    </releases>
                    <snapshots>
                      <enabled>false</enabled>
                    </snapshots>
                  </repository>
                  <repository>
                    <id>apache.snapshots</id>
                    <url>https://repository.apache.org/snapshots</url>
                    <releases>
                      <enabled>false</enabled>
                    </releases>
                    <snapshots>
                      <enabled>true</enabled>
                      <updatePolicy>always</updatePolicy>
                    </snapshots>
                  </repository>
                  <repository>
                    <id>eclipse-releases</id>
                    <url>https://repo.eclipse.org/content/groups/releases/</url>
                    <releases>
                      <enabled>true</enabled>
                    </releases>
                    <snapshots>
                      <enabled>false</enabled>
                    </snapshots>
                  </repository>
                  <repository>
                    <id>jetty-releases</id>
                    <url>https://repo.eclipse.org/content/repositories/jetty-releases/</url>
                    <releases>
                      <enabled>true</enabled>
                    </releases>
                    <snapshots>
                      <enabled>false</enabled>
                    </snapshots>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>apache.snapshots</id>
                    <url>https://repository.apache.org/snapshots</url>
                    <releases>
                      <enabled>false</enabled>
                    </releases>
                    <snapshots>
                      <enabled>true</enabled>
                      <updatePolicy>always</updatePolicy>
                    </snapshots>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>default</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      - name: Setup Maven Toolchains
        run: |
          mkdir -p $HOME/.m2
          cat > $HOME/.m2/toolchains.xml << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <toolchains xmlns="http://maven.apache.org/TOOLCHAINS/1.1.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                      xsi:schemaLocation="http://maven.apache.org/TOOLCHAINS/1.1.0 http://maven.apache.org/xsd/toolchains-1.1.0.xsd">
            <toolchain>
              <type>jdk</type>
              <provides>
                <version>1.8</version>
                <vendor>temurin</vendor>
              </provides>
              <configuration>
                <jdkHome>${{env.JAVA_HOME}}</jdkHome>
              </configuration>
            </toolchain>
          </toolchains>
          EOF

      - name: Install Jetty Dependency
        run: |
          mkdir -p ~/.m2/repository/org/eclipse/jetty/aggregate/jetty-all/9.4.57.v20241219/
          wget -q https://repo1.maven.org/maven2/org/eclipse/jetty/aggregate/jetty-all/9.4.57.v20241219/jetty-all-9.4.57.v20241219-uber.jar -O ~/.m2/repository/org/eclipse/jetty/aggregate/jetty-all/9.4.57.v20241219/jetty-all-9.4.57.v20241219.jar
          wget -q https://repo1.maven.org/maven2/org/eclipse/jetty/aggregate/jetty-all/9.4.57.v20241219/jetty-all-9.4.57.v20241219.pom -O ~/.m2/repository/org/eclipse/jetty/aggregate/jetty-all/9.4.57.v20241219/jetty-all-9.4.57.v20241219.pom

      - name: Compile and Run Basic Tests
        run: mvn clean compile test
        
      - name: Run Extended Tests
        run: mvn test -P extended-test
        continue-on-error: true

      - name: Package
        if: success()
        run: mvn package -DskipTests

      - name: Comment PR with Test Results
        uses: actions/github-script@v7
        if: always()
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const { owner, repo, number } = context.issue;
            const basicCompile = "${{ job.steps['Compile and Run Basic Tests'].outcome }}";
            const extendedTests = "${{ job.steps['Run Extended Tests'].outcome }}";
            const packaging = "${{ job.steps['Package'].outcome }}";
            
            let statusIcon = "❌";
            let mergeReadiness = "**DO NOT MERGE** - Some tests have failed.";
            
            if (basicCompile === "success") {
              statusIcon = "✅";
              mergeReadiness = "**READY TO MERGE** - All required tests have passed.";
            }
            
            const body = `## Build Status: ${statusIcon}
            
            | Step | Status |
            | ---- | ------ |
            | Basic Compile & Tests | ${basicCompile === "success" ? "✅ Passed" : "❌ Failed"} |
            | Extended Tests | ${extendedTests === "success" ? "✅ Passed" : extendedTests === "skipped" ? "⏩ Skipped" : "⚠️ Issues (Non-blocking)"} |
            | Package | ${packaging === "success" ? "✅ Passed" : packaging === "skipped" ? "⏩ Skipped" : "❌ Failed"} |
            
            ${mergeReadiness}
            
            [View full workflow run](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})
            `;
            
            github.rest.issues.createComment({
              owner,
              repo,
              issue_number: number,
              body
            });