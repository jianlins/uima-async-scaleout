name: Release Packaging

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to upload artifacts to (e.g., v2.11.0)'
        required: true
        type: string
        default: "2.11.0"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Set up Maven Settings
        run: |
          mkdir -p $HOME/.m2
          cat > $HOME/.m2/settings.xml << EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
            xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
            xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                              https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <profiles>
              <profile>
                <id>default</id>
                <repositories>
                  <repository>
                    <id>central</id>
                    <url>https://repo1.maven.org/maven2</url>
                    <releases>
                      <enabled>true</enabled>
                    </releases>
                    <snapshots>
                      <enabled>false</enabled>
                    </snapshots>
                  </repository>
                  <repository>
                    <id>apache.snapshots</id>
                    <url>https://repository.apache.org/snapshots</url>
                    <releases>
                      <enabled>false</enabled>
                    </releases>
                    <snapshots>
                      <enabled>true</enabled>
                      <updatePolicy>always</updatePolicy>
                    </snapshots>
                  </repository>
                  <repository>
                    <id>eclipse-releases</id>
                    <url>https://repo.eclipse.org/content/groups/releases/</url>
                    <releases>
                      <enabled>true</enabled>
                    </releases>
                    <snapshots>
                      <enabled>false</enabled>
                    </snapshots>
                  </repository>
                  <repository>
                    <id>jetty-releases</id>
                    <url>https://repo.eclipse.org/content/repositories/jetty-releases/</url>
                    <releases>
                      <enabled>true</enabled>
                    </releases>
                    <snapshots>
                      <enabled>false</enabled>
                    </snapshots>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>apache.snapshots</id>
                    <url>https://repository.apache.org/snapshots</url>
                    <releases>
                      <enabled>false</enabled>
                    </releases>
                    <snapshots>
                      <enabled>true</enabled>
                      <updatePolicy>always</updatePolicy>
                    </snapshots>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>default</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      - name: Setup Maven Toolchains
        run: |
          mkdir -p $HOME/.m2
          cat > $HOME/.m2/toolchains.xml << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <toolchains xmlns="http://maven.apache.org/TOOLCHAINS/1.1.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                      xsi:schemaLocation="http://maven.apache.org/TOOLCHAINS/1.1.0 http://maven.apache.org/xsd/toolchains-1.1.0.xsd">
            <toolchain>
              <type>jdk</type>
              <provides>
                <version>1.8</version>
                <vendor>temurin</vendor>
              </provides>
              <configuration>
                <jdkHome>${{env.JAVA_HOME}}</jdkHome>
              </configuration>
            </toolchain>
          </toolchains>
          EOF

      - name: Set release version from tag (for release trigger)
        if: github.event_name == 'release'
        run: |
          echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
          
      - name: Set release version from input (for manual trigger)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "RELEASE_TAG=${{ github.event.inputs.release_tag }}" >> $GITHUB_ENV
          RELEASE_VERSION="${{ github.event.inputs.release_tag }}"
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV

      - name: Debug Maven Settings
        run: |
          echo "=== Maven Home ==="
          mvn -version
          echo "=== Maven Effective Settings ==="
          mvn help:effective-settings

      - name: Install Jetty Dependency
        run: |
          echo "=== Installing Jetty Dependency Directly ==="
          mkdir -p ~/.m2/repository/org/eclipse/jetty/aggregate/jetty-all/9.4.57.v20241219/
          wget -q https://repo1.maven.org/maven2/org/eclipse/jetty/aggregate/jetty-all/9.4.57.v20241219/jetty-all-9.4.57.v20241219-uber.jar -O ~/.m2/repository/org/eclipse/jetty/aggregate/jetty-all/9.4.57.v20241219/jetty-all-9.4.57.v20241219.jar
          wget -q https://repo1.maven.org/maven2/org/eclipse/jetty/aggregate/jetty-all/9.4.57.v20241219/jetty-all-9.4.57.v20241219.pom -O ~/.m2/repository/org/eclipse/jetty/aggregate/jetty-all/9.4.57.v20241219/jetty-all-9.4.57.v20241219.pom
          ls -la ~/.m2/repository/org/eclipse/jetty/aggregate/jetty-all/9.4.57.v20241219/

      - name: Build with Maven
        run: mvn clean package -Dmaven.test.skip=true -DskipTests -DskipITs -X -U

      - name: List generated packages
        run: |
          ls -la target/uima-as-*.zip
          ls -la target/uima-as-*.tar.gz
          
      - name: Upload ZIP package to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/uima-as-*.zip
          tag_name: ${{ env.RELEASE_TAG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload TAR.GZ package to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/uima-as-*.tar.gz
          tag_name: ${{ env.RELEASE_TAG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}